<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Slide Controller</title>
    <!-- Reuse the same sophisticated style -->
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        /* Desktop specific overrides */
        body {
            background: transparent;
            /* For electron transparency */
        }

        .window-frame {
            background-color: rgba(15, 23, 42, 0.95);
            height: 100vh;
            width: 100vw;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 50px rgba(0, 198, 251, 0.2);
        }

        .title-bar {
            height: 40px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 15px;
            background: rgba(0, 0, 0, 0.2);
            -webkit-app-region: drag;
            /* Draggable area */
        }

        .win-btn {
            width: 30px;
            height: 30px;
            margin-left: 10px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-app-region: no-drag;
            transition: all 0.2s;
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        .win-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .win-btn.close:hover {
            background: #ef4444;
        }

        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .qr-container {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 198, 251, 0.3);
            margin-bottom: 30px;
        }

        #qrcode canvas {
            display: block;
        }

        h2 {
            margin-bottom: 10px;
            font-weight: 300;
            color: #94a3b8;
        }

        .url {
            font-family: monospace;
            color: #00c6fb;
            font-size: 1.2rem;
            margin-top: 10px;
        }

        .logo-large {
            width: 100px;
            margin-bottom: 30px;
            filter: drop-shadow(0 0 15px rgba(0, 198, 251, 0.4));
        }

        .instructions {
            text-align: center;
            color: var(--text-secondary);
            max-width: 400px;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <div class="window-frame">
        <div class="title-bar">
            <button class="win-btn" id="minBtn">−</button>
            <button class="win-btn close" id="closeBtn">×</button>
        </div>

        <div class="background-glow"></div>

        <div class="content-area">
            <img src="logo.png" class="logo-large">

            <div class="qr-container" id="qrcode"></div>

            <h2>Scan to Connect</h2>
            <div class="url" id="serverUrl">Initializing...</div>

            <p class="instructions" style="margin-top: 20px">
                Open the camera on your mobile device<br>
                and scan the QR code to start controlling.
            </p>
        </div>
    </div>

    <!-- QR Code Library for generating image in browser -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
    <script>
        const { ipcRenderer } = require('electron');

        document.getElementById('minBtn').addEventListener('click', () => {
            ipcRenderer.send('app-minimize');
        });

        document.getElementById('closeBtn').addEventListener('click', () => {
            ipcRenderer.send('app-close');
        });

        ipcRenderer.on('server-info', (event, { url }) => {
            document.getElementById('serverUrl').textContent = url;
            const qrContainer = document.getElementById('qrcode');

            QRCode.toCanvas(url, {
                width: 200,
                margin: 0,
                color: {
                    dark: '#0f172a',
                    light: '#ffffff'
                }
            }, function (error, canvas) {
                if (error) console.error(error);
                qrContainer.appendChild(canvas);
            });
        });
    </script>
</body>

</html>
